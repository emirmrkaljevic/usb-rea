name: gadget-e2e
# Experimental: emulate a USB HID lamp with dummy_hcd + configfs, capture it with usbmon,
# and check that usb-rea recovers the protocol from real kernel traffic.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "scripts/gadget_e2e.sh", ".github/workflows/gadget.yml"]
jobs:
  gadget:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: kernel modules + capture tools
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark "linux-modules-extra-$(uname -r)" || \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q tshark
          sudo modprobe dummy_hcd && sudo modprobe libcomposite && sudo modprobe usbmon
          sudo mount -t configfs none /sys/kernel/config 2>/dev/null || true
          ls /sys/class/udc
      - run: pip install -e .
      - name: emulated device end to end
        run: sudo env "PATH=$PATH" bash scripts/gadget_e2e.sh
